[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routine-doctor-backend"
version = "0.1.0"
description = "Routine Doctor: Alexa+ compatible MCP add-on server and smart home automation simulator"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "anyio>=4.0",
    "sse-starlette>=3.5.0",
    "httpx2>=2.10.0",
    "jsonschema>=4.20.0",
    "PyJWT[crypto]>=2.10.1",
    "python-multipart>=0.0.9",
    "mcp-types==2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
