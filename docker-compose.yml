version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        CMD ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=data/routine_doctor.sqlite3
      - FRONTEND_ORIGIN=http://localhost:5173
      - PUBLIC_BASE_URL=http://localhost:8000
      - AUTH_ENABLED=0
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 5173
        CMD ["npm", "run", "dev", "--", "--host"]
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend-data:
